name: linter

# Pull requests only. A push to main runs deploy.yml, which gates the deploy on
# its own lint job — running this one there too would just double the checks.
on:
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      # Check, never write: the job used to run the formatters in fix mode with
      # its commit step disabled, so every correction it made was thrown away.
      - name: Run Pint
        run: composer lint:check

      - name: Lint Frontend
        run: npm run lint
